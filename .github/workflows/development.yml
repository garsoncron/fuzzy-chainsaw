name: Development CI/CD

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development, main ]

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '9'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate TypeScript types
      run: pnpm generate:types
      env:
        DATABASE_URI: postgresql://postgres:postgres@localhost:5432/test_db
        PAYLOAD_SECRET: test-secret-for-ci-minimum-32-characters
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        
    - name: Run linting
      run: pnpm lint

    - name: Build application
      run: pnpm build
      env:
        DATABASE_URI: postgresql://postgres:postgres@localhost:5432/test_db
        PAYLOAD_SECRET: test-secret-for-ci-minimum-32-characters
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    - name: Run integration tests
      run: pnpm test:int
      env:
        DATABASE_URI: postgresql://postgres:postgres@localhost:5432/test_db
        PAYLOAD_SECRET: test-secret-for-ci-minimum-32-characters
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    # TODO: Add E2E tests when database is properly configured
    # - name: Run E2E tests
    #   run: pnpm test:e2e
    #   env:
    #     DATABASE_URI: postgresql://postgres:postgres@localhost:5432/test_db
    #     PAYLOAD_SECRET: test-secret-for-ci-minimum-32-characters
    #     NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security audit
      run: |
        npx audit-ci --config .audit-ci.json || exit 0
        
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  performance-check:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build for performance analysis
      run: pnpm build
      env:
        DATABASE_URI: postgresql://postgres:postgres@localhost:5432/test_db
        PAYLOAD_SECRET: test-secret-for-ci-minimum-32-characters
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        
    - name: Analyze bundle size
      run: |
        npx @next/bundle-analyzer
        echo "Bundle analysis complete - check for significant size increases"